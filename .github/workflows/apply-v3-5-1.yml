name: Apply IPAP v3.5.1 source cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source-management patch
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD=.ipap-v3.5.1-index.patch.gz.b64
          if [ ! -f "$PAYLOAD" ]; then
            echo "Patch payload already consumed."
            exit 0
          fi
          base64 -d "$PAYLOAD" | gunzip > /tmp/ipap-v351.patch
          git apply --check /tmp/ipap-v351.patch
          git apply /tmp/ipap-v351.patch

          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text()
          scripts=[]
          for m in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I):
              tag=s[m.start():s.find('>',m.start())+1]
              if 'src=' not in tag.lower(): scripts.append(m.group(1))
          pathlib.Path('/tmp/ipap-inline.js').write_text('\n'.join(scripts))
          assert 'const APP_VERSION = "3.5.1";' in s
          assert s.count('<details') == s.count('</details>')
          PY
          node --check /tmp/ipap-inline.js

          rm -f "$PAYLOAD" .github/workflows/apply-v3-5-1.yml
          git config user.name "IPAP-Dev Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "IPAP Base Study Program v3.5.1 — Cleaner Source Management"
          git push origin main
