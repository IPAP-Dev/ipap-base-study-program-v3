name: Apply IPAP v3.5.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged v3.5.0 patch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .ipap-v3.5-patch ]; then
            echo "No staged v3.5 patch; nothing to do."
            exit 0
          fi
          cat .ipap-v3.5-patch/part* > /tmp/index.patch.gz.b64
          base64 -d /tmp/index.patch.gz.b64 | gunzip > /tmp/index.patch
          git apply --check /tmp/index.patch
          git apply /tmp/index.patch

          cat > sw.js <<'EOF'
          const CACHE_NAME = "ipap-base-study-program-v3.5.0";
          const CORE_ASSETS = [
            "./",
            "./index.html",
            "./manifest.webmanifest",
            "./supabase-config.js",
            "./version.json",
            "./banks/heart-v1.js",
            "./icons/apple-touch-icon.png",
            "./icons/icon-192.png",
            "./icons/icon-512.png"
          ];

          self.addEventListener("install", event => {
            event.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(CORE_ASSETS)));
            // Do not skipWaiting here. The app prompts the learner before applying an update.
          });

          self.addEventListener("activate", event => {
            event.waitUntil(
              caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k))))
                .then(() => self.clients.claim())
            );
          });

          self.addEventListener("message", event => {
            if (event.data && event.data.type === "SKIP_WAITING") self.skipWaiting();
          });

          async function networkFirst(request) {
            try {
              const response = await fetch(request);
              if (response && response.ok) {
                const cache = await caches.open(CACHE_NAME);
                cache.put(request, response.clone());
              }
              return response;
            } catch (error) {
              const cached = await caches.match(request);
              if (cached) return cached;
              throw error;
            }
          }

          self.addEventListener("fetch", event => {
            const request = event.request;
            if (request.method !== "GET") return;
            const url = new URL(request.url);
            if (url.origin !== self.location.origin) return;
            if (request.mode === "navigate") {
              event.respondWith(networkFirst(request).catch(() => caches.match("./index.html")));
              return;
            }
            if (url.pathname.endsWith("/supabase-config.js") || url.pathname.endsWith("/version.json") || url.pathname.endsWith("/sw.js")) {
              event.respondWith(networkFirst(request));
              return;
            }
            event.respondWith(
              caches.match(request).then(cached => cached || fetch(request).then(response => {
                if (response && response.ok) {
                  const clone = response.clone();
                  caches.open(CACHE_NAME).then(cache => cache.put(request, clone));
                }
                return response;
              }))
            );
          });
          EOF

          cat > version.json <<'EOF'
          {
            "name": "IPAP Base Study Program",
            "version": "3.5.0",
            "schemaVersion": 11,
            "questionIdScheme": "immutable-v1"
          }
          EOF

          rm -rf .ipap-v3.5-patch
          rm -f .ipap-v3.5-index.patch.gz.b64
          git config user.name "IPAP-Dev Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No deployment changes to commit."
            exit 0
          fi
          git commit -m "IPAP Base Study Program v3.5.0 — Guided Setup, Visual Day Builder, and Timing"
          git push origin main
